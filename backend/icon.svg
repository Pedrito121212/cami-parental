<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160c20"/>
      <stop offset="100%" stop-color="#2a1438"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  
  <!-- Escudo Rosa -->
  <path d="M256 80 L390 135 V270 C390 365 256 430 256 430 C256 430 122 365 122 270 V135 Z" fill="url(#shieldGrad)" filter="url(#glow)"/>
  
  <!-- Corona Dorada en el centro -->
  <path d="M190 290 L170 205 L225 245 L256 185 L287 245 L342 205 L322 290 Z" fill="#ffd166" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Detalles de gemas y destellos -->
  <circle cx="170" cy="205" r="8" fill="#ffffff"/>
  <circle cx="256" cy="185" r="10" fill="#ffffff"/>
  <circle cx="342" cy="205" r="8" fill="#ffffff"/>
  <circle cx="256" cy="265" r="6" fill="#f43f5e"/>
</svg>
