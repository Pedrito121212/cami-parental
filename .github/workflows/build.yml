name: Compilar APK Cami Parental 🌸

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: android-actions/setup-android@v3
    - working-directory: ./android
      run: |
        sed -i 's/RepositoriesMode.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_SETTINGS/g' settings.gradle.kts || true
        chmod +x gradlew || true
        gradle assembleDebug -x lint -x test --no-daemon
    - uses: actions/upload-artifact@v4
      with:
        name: CamiParental-APK
        path: android/app/build/outputs/apk/debug/*.apk
